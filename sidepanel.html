<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Merit Wallet</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        /* A side panel is a real, user-resizable dock (2026-09-10) —
           width: 100% fills whatever the user's actually set it to. */
        width: 100%;
        height: 100vh;
        box-sizing: border-box;
        background: #11162a;
        color: #cbd5e1;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
        overflow: hidden;
      }
      /* 2026-09-14 — one mount point, replacing the separate header-root/
         account-header-root/agent-header-root/panel-title-and-menu-tab-
         root roots this file used to hand-wire (each with its own bit of
         layout CSS reproducing the wallet shell's own fixed-header/
         scrollable-body split by hand). The single MeritWallet component
         from @sponsorcoin/spcoin-panels (2026-09-14, docs/design/
         extensionPlan.md's "Direction changed" entry) now owns that whole
         layout internally — this file only needs to give #wallet-root the
         full available space.
         2026-09-14, later same day, on request ("totally remove the Open
         Button") — the bottom <main>/#open-app footer this comment used to
         describe is gone; #wallet-root now takes 100% of #scale-root
         itself rather than sharing it with a footer. WalletHeader's own
         close icon (closeIconSrc, sidepanel.ts) already does what that
         button did — see this file's own www.png/handleOpenApp history for
         why a second, separate "Open" control became redundant. */
      #scale-root {
        width: 100%;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #wallet-root {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- 2026-09-13, on request — a visible build marker, deliberately
         OUTSIDE #scale-root, positioned fixed so it survives any
         scrolling inside the panel. Bump BUILD_TAG's text every time a
         real change is rebuilt into deploy/, and check this label after
         reloading the extension before evaluating anything else. -->
    <div id="build-tag" style="position: fixed; bottom: 2px; right: 4px; z-index: 999999; font: 9px monospace; color: #475569; background: rgba(0,0,0,0.35); padding: 1px 4px; border-radius: 3px; pointer-events: none;">build 63</div>
    <div id="scale-root">
    <!-- Single MeritWallet mount point (2026-09-14) — sidepanel.ts renders
         the whole wallet (header/subtitle/tab-strip/active panel body)
         here as one component tree instead of separate hand-assembled
         mount roots. See sidepanel.ts's own doc comment.
         2026-09-14, later same day — the separate bottom Open <main>/
         button that used to sit here as a plain sibling is gone (see
         #scale-root's own style comment); #wallet-root is the only thing
         left in #scale-root now. -->
    <div id="wallet-root"></div>
    </div>
    <script type="module" src="sidepanel.ts"></script>
  </body>
</html>
