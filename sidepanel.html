<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Merit Wallet</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        /* Fixed 300px made sense for the old popup (Chrome sizes those
           itself, content included). A side panel is a real, user-
           resizable dock instead (2026-09-10) — width: 100% fills
           whatever the user's actually set it to rather than looking
           like a small fixed box floating inside a wider panel. */
        width: 100%;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 0 0 22px;
        background: #11162a;
        color: #cbd5e1;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
      }
      main {
        padding: 20px 22px 0;
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;
        display: block;
      }
      p.subtitle {
        margin: 4px 0 18px;
        font-size: 13px;
        color: #94a3b8;
      }
      button {
        width: 100%;
        padding: 9px 0;
        border: none;
        border-radius: 6px;
        background: #5981f3;
        color: #ffffff;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #4a6fe0;
      }
    </style>
  </head>
  <body>
    <!-- Real, portable WalletHeader (2026-09-11, "Pages Grey header bar"
         slice — see docs/design/extensionPlan.md) mounted here by
         sidepanel.ts, replacing the hand-written <header> this file used
         to have. Not yet published to npm — consumed from a local
         node_source/spCoinPanels copy (file: dependency, same pattern the
         web app itself uses) specifically so this can be visually compared
         against the real embedded wallet before anything is republished. -->
    <div id="header-root"></div>
    <main>
      <img class="icon" src="icons/icon128.png" alt="" />
      <p class="subtitle">Sponsor Coin</p>
      <button id="open-app" type="button">Open</button>
    </main>
    <script type="module" src="sidepanel.ts"></script>
  </body>
</html>
