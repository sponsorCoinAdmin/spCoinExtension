<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Merit Wallet</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        /* Fixed 300px made sense for the old popup (Chrome sizes those
           itself, content included). A side panel is a real, user-
           resizable dock instead (2026-09-10) — width: 100% fills
           whatever the user's actually set it to rather than looking
           like a small fixed box floating inside a wider panel. */
        width: 100%;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 0 0 22px;
        background: #11162a;
        color: #cbd5e1;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
      }
      /* Header row (2026-09-10, on direct request — matches the real web
         app's Merit Wallet popup header convention: icon + title on the
         left, a close X on the right). Not yet the actual portable
         WalletHeader.tsx component from @sponsorcoin/spcoin-panels — that
         component depends on next/image and usePanelTree, neither
         available/appropriate in this Vite-built extension yet. See
         extensionPlan.md for the deferred full port. */
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid #1f2942;
        background: #161d38;
        text-align: left;
      }
      header img {
        width: 22px;
        height: 22px;
        display: block;
        flex-shrink: 0;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        flex: 1;
        min-width: 0;
      }
      #close-sidepanel {
        appearance: none;
        border: none;
        background: transparent;
        color: #94a3b8;
        font-size: 16px;
        line-height: 1;
        padding: 4px 6px;
        cursor: pointer;
        border-radius: 4px;
        flex-shrink: 0;
      }
      #close-sidepanel:hover {
        background: #232c4d;
        color: #ffffff;
      }
      main {
        padding: 20px 22px 0;
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;
        display: block;
      }
      h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #ffffff;
      }
      p.subtitle {
        margin: 4px 0 18px;
        font-size: 13px;
        color: #94a3b8;
      }
      button {
        width: 100%;
        padding: 9px 0;
        border: none;
        border-radius: 6px;
        background: #5981f3;
        color: #ffffff;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #4a6fe0;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon16.png" alt="" />
      <h1>Merit Wallet</h1>
      <button id="close-sidepanel" type="button" aria-label="Close" title="Close">✕</button>
    </header>
    <main>
      <img class="icon" src="icons/icon128.png" alt="" />
      <h2>Merit Wallet</h2>
      <p class="subtitle">Sponsor Coin</p>
      <button id="open-app" type="button">Open</button>
    </main>
    <script type="module" src="sidepanel.ts"></script>
  </body>
</html>
